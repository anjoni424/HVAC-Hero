services:
  - type: web
    name: slipspace-yfinance-service
    runtime: python
    rootDir: services/yfinance-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: CORS_ORIGINS
        value: "*"
